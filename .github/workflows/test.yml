name: Run Tests

# Trigger: push, PR and manually
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Checkout labyrinth-interface (for shared models)
        uses: actions/checkout@v4
        with:
          repository: 'brackettz/labyrinth-interface'
          path: 'labyrinth-interface'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'

      - name: Generate Java Models
        run: |
            cd labyrinth-interface/models
            npm install
            node generate-async-models.js

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build and install shared models
        run: |
          cd labyrinth-interface/models
          
          mkdir -p src/main/java/labyrinth/contracts/models
          
          cp models/async/*.java src/main/java/labyrinth/contracts/models/
          
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>
              <groupId>mci.dibse.crazylabyrinth</groupId>
              <artifactId>shared-model</artifactId>
              <version>0.0.9</version>
              <properties>
                  <maven.compiler.source>25</maven.compiler.source>
                  <maven.compiler.target>25</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-annotations</artifactId>
                      <version>2.18.2</version>
                  </dependency>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-databind</artifactId>
                      <version>2.18.2</version>
                  </dependency>
              </dependencies>
              <build>
                  <sourceDirectory>.</sourceDirectory>
              </build>
          </project>
          EOF
        
          mvn clean install -DskipTests
          cd ../..

      - name: Run Tests
        run: mvn test