name: Run Tests

# Trigger: push, PR and manually
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: Checkout labyrinth-interface (for shared models)
        uses: actions/checkout@v4
        with:
          repository: 'brackettz/labyrinth-interface'
          path: 'labyrinth-interface'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Generate Java Models
        run: |
          echo "=== Start Model Generation ==="
          cd labyrinth-interface/models

          echo "=== Vor npm install - Dateien im models Ordner: ==="
          ls -lah

          echo "=== npm install ==="
          npm install

          echo "=== Nach npm install - Dateien: ==="
          ls -lah

          echo "=== Führe generate-async-models.js aus ==="
          node generate-async-models.js

          echo "=== Nach Generation - Alle Ordner und Dateien: ==="
          ls -lah

          echo "=== Prüfe ob async/ Ordner existiert: ==="
          if [ -d "async" ]; then
            echo "✓ async/ Ordner gefunden!"
            ls -lah async/
          else
            echo "✗ async/ Ordner NICHT gefunden!"
          fi

          echo "=== Suche nach allen .java Files: ==="
          find . -name "*.java" -type f

      - name: Build and install shared models
        run: |
          cd labyrinth-interface/models
          
          mkdir -p src/main/java/labyrinth/contracts/models
          
          find async -name "*.java" -exec cp {} src/main/java/labyrinth/contracts/models/ \;
          
          echo "Prüfe Dateipfad für Maven:"
          ls -R src/main/java/labyrinth/contracts/models/
          
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>mci.dibse.crazylabyrinth</groupId>
              <artifactId>shared-model</artifactId>
              <version>0.0.9</version>
              <properties>
                  <maven.compiler.source>25</maven.compiler.source>
                  <maven.compiler.target>25</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-annotations</artifactId>
                      <version>2.18.2</version>
                  </dependency>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-databind</artifactId>
                      <version>2.18.2</version>
                  </dependency>
              </dependencies>
              <build>
                  <sourceDirectory>src/main/java</sourceDirectory>
              </build>
          </project>
          EOF
          
          mvn clean install -DskipTests
          
          echo ">>> JAR-Inhalt Check:"
          jar tf target/shared-model-0.0.9.jar | grep .class || echo "FEHLER: JAR ist immer noch leer!"

      - name: Run Tests
        run: mvn test