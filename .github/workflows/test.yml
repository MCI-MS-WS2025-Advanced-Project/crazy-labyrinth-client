name: Run Tests

# Trigger: push, PR and manually
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout client repository
        uses: actions/checkout@v4

      - name: checked out repo
        run: |
          echo "checked out repo"

      - name: Checkout labyrinth-interface (for shared models)
        uses: actions/checkout@v4
        with:
          repository: 'brackettz/labyrinth-interface'
          path: 'labyrinth-interface'

      - name: checked out brackettz
        run: |
          echo "checked out brackettz"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: JDK setup
        run: |
          echo "JDK setup"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
            node-version: '20'

      - name: node setup
        run: |
          echo "node setup"

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: cache maven
        run: |
          echo "cache maven"

      - name: Generate Java Models
        run: |
            echo "Generate erreicht"
            cd labyrinth-interface/models
            npm install
            node generate-async-models.js

      - name: generate models
        run: |
          echo "generate models"

      - name: Build and install shared models
        run: |
          cd labyrinth-interface/models
          
          echo ">>> Suche generierte Java-Dateien..."
          find . -name "*.java"
          
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
              <modelVersion>4.0.0</modelVersion>
              <groupId>mci.dibse.crazylabyrinth</groupId>
              <artifactId>shared-model</artifactId>
              <version>0.0.9</version>
              <properties>
                  <maven.compiler.source>25</maven.compiler.source>
                  <maven.compiler.target>25</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>
              <dependencies>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-annotations</artifactId>
                      <version>2.18.2</version>
                  </dependency>
                  <dependency>
                      <groupId>com.fasterxml.jackson.core</groupId>
                      <artifactId>jackson-databind</artifactId>
                      <version>2.18.2</version>
                  </dependency>
              </dependencies>
              <build>
                  <sourceDirectory>.</sourceDirectory>
              </build>
          </project>
          EOF
          
          mvn clean install -DskipTests
          
          echo ">>> Validierung: Inhalt des erzeugten JARs:"
          jar tf target/shared-model-0.0.9.jar | grep .class || echo "FEHLER: JAR enthält keine Klassen!"
          
          cd ../..

      - name: Run Tests
        run: |
          mvn clean test -U