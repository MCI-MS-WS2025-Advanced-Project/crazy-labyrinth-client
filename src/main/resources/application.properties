spring.application.name=crazyLabyrinthClient

#  NONE, REACTIVE, SERVLET
spring.main.web-application-type=none
spring.profiles.active=dev


# full, minimal
app.spring.mode=minimal


#Management Server
management.server.url=http://localhost
management.server.request.timeout.milliseconds=5000
management.server.port=8888


# WebSocket Configuration for Game Servers
game.server.websocket.endpoint=/game
game.server.websocket.port=9001
game.server.websocket.allowedOrigins=*



# Spring Boot Configuration
server.port=${game.server.websocket.port:9000}



# timer in secunden
game.default.timer.setting.enabled=false
game.default.timer.ifEnabled=3600
game.default.board.size=7
game.default.bonus.enabled=false