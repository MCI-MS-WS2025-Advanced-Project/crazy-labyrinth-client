spring.application.name=crazyLabyrinthClient

#  NONE, REACTIVE, SERVLET
spring.main.web-application-type=none
spring.profiles.active=dev

# resolution of game board is ~ 4:3
game.board.view.resolution=1024x768
#game.board.view.resolution=1152x864
#game.board.view.resolution=1280x960
#game.board.view.resolution=1400x1050
#game.board.view.resolution=1600x1200



# full, minimal
app.spring.mode=minimal


#Management Server
management.server.url=http://localhost
management.server.request.timeout.milliseconds=5000
management.server.port=8081



game.default.bonus.enabled = false
game.default.board.size = 7
game.default.timer.ifEnabled = 3600
game.default.timer.setting.enabled = false

